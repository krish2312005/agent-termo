name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      # The repository-wide lint command currently reports unrelated errors
      # in the experimental core prototype and existing TUI files. Lint the
      # changed runtime modules while that baseline debt is addressed.
      - name: Lint changed runtime
        run: bunx eslint src/main.ts src/runtime/verify.ts src/runtime/checks.ts

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: CLI smoke test
        run: bun run cli --help
