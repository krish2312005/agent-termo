name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Install Playwright and Chromium for browser integration tests
        run: |
          npm install --no-save --no-package-lock playwright
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Typecheck
        run: bun run typecheck

      # The repository-wide lint command currently reports unrelated errors
      # in the experimental core prototype and existing TUI files. Lint the
      # changed runtime modules while that baseline debt is addressed.
      - name: Lint changed runtime
        run: bunx eslint src/main.ts src/runtime/git-graph.ts src/runtime/verify.ts src/runtime/checks.ts src/runtime/browser-verification.ts

      - name: Test
        run: bun run test

      - name: Build, pack, install, and test npm artifact
        run: bun run test:package

      - name: TUI pseudo-terminal input smoke
        shell: bash
        run: |
          set -o pipefail
          set +e
          output="$( { sleep 2; printf '/status\r'; sleep 1; printf 'exit\r'; } | timeout 15s script -q -e -c 'env TERM=xterm-256color COLUMNS=100 LINES=30 OPENTUI_GRAPHICS=false NIM_API_KEY=smoke-test bun src/cli.ts' /dev/null 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if grep -Eq 'Orphan text error|Fatal error:' <<< "$output"; then exit 1; fi
          if ! grep -q 'Project:' <<< "$output"; then
            echo 'TUI did not accept /status through the interactive composer.'
            exit 1
          fi
          if ! grep -q 'Session complete\.' <<< "$output"; then
            echo 'TUI did not accept exit through the interactive composer.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "TUI interactive smoke exited with status $status."
            exit "$status"
          fi
      - name: Source CLI smoke test
        run: bun run cli --help

  terminal-windows:
    name: Windows terminal process lifecycle
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Test terminal process lifecycle
        run: bunx vitest run tests/unit/terminal-sessions.test.ts

      - name: Test Windows file glob path normalization
        run: bunx vitest run tests/integration/basic.test.ts -t "finds TypeScript files"
