name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for browser integration tests
        run: |
          npm install --prefix "$RUNNER_TEMP/agent-termo-playwright" --no-save --no-package-lock playwright
          "$RUNNER_TEMP/agent-termo-playwright/node_modules/.bin/playwright" install --with-deps chromium
          ln -s "$RUNNER_TEMP/agent-termo-playwright/node_modules/playwright" node_modules/playwright

      - name: Typecheck
        run: bun run typecheck

      # The repository-wide lint command currently reports unrelated errors
      # in the experimental core prototype and existing TUI files. Lint the
      # changed runtime modules while that baseline debt is addressed.
      - name: Lint changed runtime
        run: bunx eslint src/main.ts src/runtime/verify.ts src/runtime/checks.ts src/runtime/browser-verification.ts

      - name: Test
        run: bun run test

      - name: Build, pack, install, and test npm artifact
        run: bun run test:package

      - name: Source CLI smoke test
        run: bun run cli --help

  terminal-windows:
    name: Windows terminal process lifecycle
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Test terminal process lifecycle
        run: bunx vitest run tests/unit/terminal-sessions.test.ts
